  <rect x="280" y="426" width="234" height="40" fill="#4AC9E3"/>
  <text x="525" y="453" font-size="26" font-weight="700" fill="#444">0.732</text>

  <!-- Legend -->
  <g font-size="22" fill="#444">
    <rect x="0" y="520" width="20" height="18" fill="#0028A5"/>
    <text x="28" y="537">tuned, best R@1</text>
    <rect x="230" y="520" width="20" height="18" fill="#4AC9E3"/>
    <text x="258" y="537">deployed (current demo)</text>
