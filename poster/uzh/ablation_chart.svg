<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550"
     font-family="Source Sans Pro, Inter, sans-serif">
  <rect x="0" y="0" width="700" height="550" fill="#ffffff"/>

  <!-- Multi-query retrieval enabled. 377-question answerable subset. -->

  <text x="0" y="40" font-size="30" font-weight="800" fill="#0028A5">
    Recall@1 by retrieval variant
  </text>
  <text x="0" y="74" font-size="22" fill="#666">
    377 answerable questions. The right document at rank 1.
  </text>

  <!-- Tick marks -->
  <g font-size="20" fill="#666" text-anchor="middle">
    <text x="280" y="110">0.0</text>
    <text x="360" y="110">0.25</text>
    <text x="440" y="110">0.50</text>
    <text x="520" y="110">0.75</text>
    <text x="600" y="110">1.0</text>
  </g>
  <g stroke="#ccc" stroke-width="0.6">
    <line x1="280" y1="118" x2="280" y2="490"/>
    <line x1="360" y1="118" x2="360" y2="490"/>
    <line x1="440" y1="118" x2="440" y2="490"/>
    <line x1="520" y1="118" x2="520" y2="490"/>
    <line x1="600" y1="118" x2="600" y2="490"/>
  </g>

  <!-- Bar width = value × 320 (x-range 280..600). Row pitch 72, bar h=40. -->

  <!-- Row 1: BM25 only — 0.716 -->
  <text x="265" y="160" font-size="26" text-anchor="end">BM25 only</text>
  <rect x="280" y="138" width="229" height="40" fill="#bdbdbd"/>
  <text x="520" y="165" font-size="26" font-weight="700" fill="#444">0.716</text>

  <!-- Row 2: Dense only — 0.411 -->
  <text x="265" y="232" font-size="26" text-anchor="end">Dense only</text>
  <rect x="280" y="210" width="132" height="40" fill="#bdbdbd"/>
  <text x="423" y="237" font-size="26" font-weight="700" fill="#444">0.411</text>

  <!-- Row 3: Hybrid 0.7/0.3 — 0.631 -->
  <text x="265" y="304" font-size="26" text-anchor="end">Hybrid 0.7/0.3</text>
  <rect x="280" y="282" width="202" height="40" fill="#bdbdbd"/>
  <text x="493" y="309" font-size="26" font-weight="700" fill="#444">0.631</text>

  <!-- Row 4: Hybrid 0.3/0.7 — 0.743 — WINNER R@1 -->
  <text x="265" y="376" font-size="26" text-anchor="end" font-weight="700">Hybrid 0.3/0.7</text>
  <rect x="280" y="354" width="238" height="40" fill="#0028A5"/>
  <text x="529" y="381" font-size="26" font-weight="800" fill="#0028A5">0.743</text>

