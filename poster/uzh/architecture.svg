<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800"
     font-family="Source Sans Pro, Inter, sans-serif">
  <rect x="0" y="0" width="980" height="800" fill="#ffffff"/>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0028A5"/>
    </marker>
  </defs>

  <!-- Font budget (980-unit viewBox displayed at 248 mm wide → ~0.253 mm/unit print):
       Stage labels   30pt SVG → ~21pt print
       Box headings   26pt SVG → ~18pt print
       Box body       20pt SVG → ~14pt print
       Annotations    18pt SVG → ~13pt print
       Legend body    36pt SVG → ~26pt print
       Legend heading 44pt SVG → ~31pt print -->

  <!-- Stage band labels — text-anchor middle so they centre over boxes. -->
  <g font-size="30" font-weight="700" fill="#0028A5" letter-spacing="1" text-anchor="middle">
    <text x="80"  y="48">1. INPUT</text>
    <text x="345" y="48">2. AGENT</text>
    <text x="640" y="48">3. RETRIEVE</text>
    <text x="860" y="48">4. RERANK</text>
  </g>

  <!-- User -->
  <g filter="url(#soft)">
    <rect x="20" y="80" width="120" height="100" rx="8" fill="#f4f4f0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="80" y="125" text-anchor="middle" font-size="26" font-weight="700">User</text>
  <text x="80" y="155" text-anchor="middle" font-size="20" fill="#555">question</text>

  <!-- Skill prompt -->
  <g filter="url(#soft)">
    <rect x="170" y="80" width="140" height="100" rx="8" fill="#0028A5"/>
  </g>
  <text x="240" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Skill prompt</text>
  <text x="240" y="142" text-anchor="middle" font-size="18" fill="#dbe4ff">prepended</text>
  <text x="240" y="166" text-anchor="middle" font-size="16" fill="#dbe4ff">trace · decide · onboard</text>

  <!-- Agent -->
  <g filter="url(#soft)">
    <rect x="340" y="60" width="180" height="140" rx="8" fill="#ffffff" stroke="#0028A5" stroke-width="2"/>
  </g>
  <text x="430" y="100" text-anchor="middle" font-size="26" font-weight="800" fill="#0028A5">Qwen3-8B</text>
  <text x="430" y="128" text-anchor="middle" font-size="20" fill="#222">agent loop</text>
  <line x1="360" y1="140" x2="500" y2="140" stroke="#dde" stroke-width="1"/>
  <text x="430" y="166" text-anchor="middle" font-size="20" fill="#555">search( )</text>
  <text x="430" y="190" text-anchor="middle" font-size="20" fill="#555">open_document( )</text>

  <!-- Hybrid search (renamed from "Hybrid retrieve" to fit box) -->
  <g filter="url(#soft)">
    <rect x="550" y="80" width="180" height="100" rx="8" fill="#e8f7fb" stroke="#4AC9E3" stroke-width="1.8"/>
  </g>
  <text x="640" y="118" text-anchor="middle" font-size="24" font-weight="800" fill="#0a5a7a">Hybrid search</text>
  <text x="640" y="146" text-anchor="middle" font-size="20" fill="#444">BM25 + dense</text>
  <text x="640" y="168" text-anchor="middle" font-size="18" fill="#444">0.7·vec + 0.3·kw</text>

  <!-- Cross-encoder -->
  <g filter="url(#soft)">
    <rect x="760" y="80" width="200" height="100" rx="8" fill="#fff6dc" stroke="#FFC845" stroke-width="1.8"/>
  </g>
  <text x="860" y="118" text-anchor="middle" font-size="24" font-weight="800" fill="#7a5400">Cross-encoder</text>
  <text x="860" y="146" text-anchor="middle" font-size="20" fill="#5a4000">ms-marco-MiniLM</text>
  <text x="860" y="168" text-anchor="middle" font-size="18" fill="#5a4000">re-score top-32</text>

  <!-- horizontal arrows -->
  <line x1="140" y1="130" x2="168" y2="130" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="310" y1="130" x2="338" y2="130" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="520" y1="130" x2="548" y2="130" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="730" y1="130" x2="758" y2="130" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Storage -->
  <g filter="url(#soft)">
    <rect x="550" y="250" width="180" height="100" rx="8" fill="#f4f4f0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="640" y="288" text-anchor="middle" font-size="24" font-weight="800">SQLite + FTS5</text>
  <text x="640" y="315" text-anchor="middle" font-size="18" fill="#555">35,353 chunks · 10,008 docs</text>
  <text x="640" y="338" text-anchor="middle" font-size="18" fill="#555">9 source types</text>
  <line x1="640" y1="180" x2="640" y2="248" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="660" y="220" font-size="18" fill="#666" font-style="italic">FTS5 candidates</text>

  <!-- Loop back -->
  <path d="M 760,170 C 660,225 510,225 520,195" stroke="#0028A5" stroke-width="2.5"
        stroke-dasharray="6,3" fill="none" marker-end="url(#ah-blue)"/>
  <text x="640" y="243" text-anchor="middle" font-size="18" fill="#0028A5" font-style="italic">
    ranked top-n
  </text>

  <!-- Answer -->
  <g filter="url(#soft)">
    <rect x="340" y="380" width="280" height="110" rx="8" fill="#ffffff" stroke="#0028A5" stroke-width="2"/>
  </g>
  <text x="480" y="420" text-anchor="middle" font-size="26" font-weight="800" fill="#0028A5">Structured answer</text>
  <text x="480" y="450" text-anchor="middle" font-size="20" fill="#222">timeline · decision · brief</text>
  <text x="480" y="476" text-anchor="middle" font-size="18" fill="#555">+ doc_id citations</text>
  <line x1="430" y1="200" x2="430" y2="378" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="530" y1="200" x2="530" y2="378" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- How it works — biggest text in the SVG (legend dominates this lower half). -->
  <g fill="#222">
    <text x="20" y="560" font-size="44" font-weight="700" fill="#0028A5">How it works</text>
    <text x="20" y="610" font-size="36">①  SKILL prompt shapes the output (trace · decide · brief).</text>
    <text x="20" y="652" font-size="36">②  Qwen3-8B decides what to search for.</text>
    <text x="20" y="694" font-size="36">③  Hybrid search finds candidate chunks.</text>
    <text x="20" y="736" font-size="36">④  Cross-encoder picks the best. <tspan font-weight="700" fill="#0028A5">73% R@1 deployed.</tspan></text>
  </g>
</svg>
